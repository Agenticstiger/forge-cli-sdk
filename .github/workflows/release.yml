# Release Pipeline — publish to PyPI and create GitHub Release
#
# Triggers:
#   - Push a tag matching v*.*.* (e.g. v0.1.0, v0.2.0a1)
#   - Manual dispatch with version input

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.1.0)"
        required: true
        type: string

# Least privilege, granted per job rather than to the whole file.
#
# This block used to read `contents: write` + `id-token: write` +
# `attestations: write`, and only two of the four jobs narrowed it. Under GitHub
# Actions' inheritance rules a job with no `permissions:` block of its own receives
# the whole workflow-level grant, so `quality-gate` and `build` were both handed
# `id-token: write` — the ability to mint an OIDC token — despite neither needing one.
# Only `publish-pypi` does, for PyPI trusted publishing, and it already scopes itself.
#
# Why that matters more here than in an ordinary repository: an OIDC token minted
# anywhere in this workflow may be accepted by PyPI as proof of identity for
# data-product-forge-sdk. So any step in `quality-gate` or `build` — including a
# third-party action reached through a floating tag — could request one and publish,
# without ever entering the job that is supposed to be the only publisher. The
# `environment: pypi` claim on `publish-pypi` blocks this ONLY IF the trusted-publisher
# configuration on PyPI also pins that environment name; if that field is blank there,
# nothing distinguishes a token minted in `build` from the real one. That setting lives
# on pypi.org and cannot be read from here, so this workflow does not depend on it.
#
# Precedent, not hypothesis: the compromise of aquasecurity/trivy-action in March 2026
# rewrote 75 of its 76 tags, and reached a backdoored LiteLLM release through that
# action sitting inside LiteLLM's own CI.
#
# `attestations: write` is dropped outright. It appeared exactly once in this file —
# in the grant itself. Nothing has ever used it.
#
# The default is now read-only, so a job added later without its own block gets the
# safe end of the mistake rather than the dangerous one.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Quality gate
  # ────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    # Lints, tests and reads the version out of pyproject.toml. Checkout is the only
    # thing here that touches the token. Explicit rather than inherited: the whole
    # defect being fixed was a job silently receiving more than it asked for.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *a* ]] || [[ "$VERSION" == *b* ]] || [[ "$VERSION" == *dev* ]] || [[ "$VERSION" == *rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install & lint
        run: |
          pip install -e ".[dev]" ruff black
          ruff check src/
          black --check src/

      - name: Run tests
        run: pytest tests/ -v

      - name: Import check
        run: python -c "from fluid_sdk import BasePlugin, CustomScaffold, Validator, PluginAction, ExecutionResult, PluginError; print('OK')"

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          TAG_BASE=$(echo "$TAG_VERSION" | sed 's/[ab].*//' | sed 's/\.dev.*//' | sed 's/rc.*//')
          if [ "$PKG_VERSION" != "$TAG_BASE" ] && [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml=${PKG_VERSION}, tag=${TAG_VERSION}"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────
  # 2. Build
  # ────────────────────────────────────────────────────────────
  build:
    name: Build Package
    needs: quality-gate
    runs-on: ubuntu-latest
    # Builds the sdist and wheel and uploads them as a run artifact. Artifact upload
    # uses the Actions runtime token, not GITHUB_TOKEN, so it needs no grant here —
    # proven in this repository rather than assumed: `publish-pypi` below declares only
    # `id-token: write`, which leaves it `contents: none`, and its
    # actions/download-artifact step has succeeded in all three successful releases.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke test
        run: |
          python -m venv /tmp/test-install
          /tmp/test-install/bin/pip install dist/*.whl
          /tmp/test-install/bin/python -c "from fluid_sdk import BasePlugin, CustomScaffold, Validator; print('OK')"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # 3. Publish to PyPI
  # ────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [quality-gate, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/data-product-forge-sdk
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # ────────────────────────────────────────────────────────────
  # 4. GitHub Release
  # ────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [quality-gate, build]
    runs-on: ubuntu-latest
    # The one job that legitimately writes: softprops/action-gh-release creates the
    # release and uploads the dist files to it. It gets `contents: write` and nothing
    # else — in particular, no `id-token: write`, which it was inheriting before.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "data-product-forge-sdk ${{ needs.quality-gate.outputs.version }}"
          prerelease: ${{ needs.quality-gate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
