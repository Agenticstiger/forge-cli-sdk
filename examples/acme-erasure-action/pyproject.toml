[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-erasure-action"
version = "0.1.0"
description = "FLUID maintenance action example — delete the rows a request table names from an Iceberg table"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["data-product-forge-sdk>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "sqlglot"]

# The name is the action's `kind`: `kind: acme-erase` in `iceberg.maintenance.actions`.
[project.entry-points."fluid_build.maintenance_actions"]
acme-erase = "acme_maintenance.erase:EraseRequested"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
